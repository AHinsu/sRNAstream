name: smallRNA
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Quality control
  - fastqc=0.12.1
  
  # Trimming and filtering
  - fastp=1.1.0
  
  # Alignment
  - bowtie=1.3.1
  - samtools=1.23
  - bedtools=2.31.1
  
  # miRNA-specific tools
  - mirdeep2=2.0.1.3
  - mirtrace=1.0.1
#  - miranda=3.3a  # target prediction (species-agnostic): installed in separate environment
  
  # Quantification
  - subread=2.1.1  # for featureCounts
  - seqkit=2.12
  
  # Aggregate QC reporting
  - multiqc=1.33
  
  # Utilities
  - pigz=2.8
  - parallel=20260122
  
  # Python packages
  - python=3.12
  
  # R and packages for differential expression
  - r-base=4.4.2
  - r-ggplot2=4.0.2
  - r-pheatmap=1.0.13
  
  # Additional utilities
  - fastx_toolkit=0.0.14

  # Python packages using pip
  - pip:
    - backports-zstd==1.3.0
    - brotli==1.2.0
    - cffi==2.0.0
    - contourpy==1.3.3
    - cutadapt==5.2
    - dnaio==1.2.2
    - fonttools==4.61.1
    - isal==0.0.0
    - kiwisolver==1.4.9
    - markupsafe==3.0.3
    - matplotlib==3.8.2
    - multiqc-bovine-plugins==1.0.0
    - numpy==1.26.3
    - pandas==2.1.4
    - pillow==11.3.0
    - pydantic-core==2.41.5
    - pyqt5==5.15.11
    - pyqt5-sip==12.17.0
    - pyyaml==6.0.3
    - regex==2026.1.15
    - rpds-py==0.30.0
    - sip==6.10.0
    - tiktoken==0.12.0
    - tornado==6.5.4
    - unicodedata2==17.0.1
    - zlib-ng==0.0.0
    - zstandard==0.25.0
    
    
